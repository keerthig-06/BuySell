<!DOCTYPE html>
<html>
<head>
    <title>DealHub - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="register-page">

        <div class="register-box">

            <div class="register-left">
                <h1>Join DealHub</h1>
                <p>Buy what you need.<br>Sell what you don't.</p>

                <div class="register-icons">
                    <div>🛍️</div>
                    <div>♻️</div>
                    <div>💰</div>
                </div>
            </div>

            <div class="register-right">

                <h2>Create Account</h2>
                <p>Join our marketplace today</p>

                <label>Full Name</label>
                <input type="text" id="registerName" placeholder="Enter your name">

                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="Enter your email">

                <label>Phone Number</label>
                <input type="tel" id="registerPhone" placeholder="Enter your phone number">

                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Create a password">

                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">

                <button onclick="register()">Create Account</button>

                <p class="login-link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
